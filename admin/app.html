<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · TS Solution</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" />
  <link rel="stylesheet" href="/admin/static/admin.css" />
  <script src="/admin/static/admin.js" defer></script>
</head>
<body class="app">
  <a class="skip-link" href="#panel">Skip to editor</a>

  <aside class="sidebar" id="sidebar" aria-label="Admin sections">
    <div class="sidebar-head">
      <img src="/assets/img/logo-ts-solution.png" width="150" height="38" alt="TS Solution" />
      <span class="sidebar-badge">Admin</span>
    </div>
    <nav id="side-nav"></nav>
    <div class="sidebar-foot">
      <a class="side-link" href="/" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
        View website
      </a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-button nav-toggle" id="nav-toggle" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Open navigation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="topbar-title">
        <h1 id="panel-title">Loading…</h1>
        <p id="save-status" class="save-status" aria-live="polite"></p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="discard-btn" disabled>Discard</button>
        <button type="button" class="btn btn-ghost" id="preview-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>Preview</span>
        </button>
        <button type="button" class="btn btn-primary" id="save-btn" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
          <span>Save &amp; publish</span>
        </button>
        <div class="user-menu">
          <button type="button" class="icon-button" id="user-btn" aria-haspopup="true" aria-expanded="false" aria-label="Account menu">
            <span class="avatar" id="avatar">?</span>
          </button>
          <div class="user-pop" id="user-pop" hidden>
            <p class="user-name" id="user-name"></p>
            <a href="#account">Account &amp; password</a>
            <button type="button" id="logout-btn">Sign out</button>
          </div>
        </div>
      </div>
    </header>

    <main class="panel" id="panel" tabindex="-1">
      <div class="loading">Loading content…</div>
    </main>
  </div>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

  <dialog class="dialog" id="confirm-dialog" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-ghost" id="confirm-cancel">Cancel</button>
        <button type="submit" value="ok" class="btn btn-primary" id="confirm-ok">Confirm</button>
      </div>
    </form>
  </dialog>

  <dialog class="dialog dialog-wide" id="media-dialog" aria-labelledby="media-title">
    <div class="dialog-head">
      <h2 id="media-title">Choose an image</h2>
      <button type="button" class="icon-button" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dialog-body" id="media-dialog-body"></div>
  </dialog>

  <dialog class="dialog dialog-preview" id="preview-dialog" aria-labelledby="preview-title">
    <div class="dialog-head">
      <h2 id="preview-title">Preview (not published)</h2>
      <div class="segmented" role="group" aria-label="Preview width">
        <button type="button" data-width="100%" aria-pressed="true">Desktop</button>
        <button type="button" data-width="820px" aria-pressed="false">Tablet</button>
        <button type="button" data-width="390px" aria-pressed="false">Mobile</button>
      </div>
      <button type="button" class="icon-button" data-close aria-label="Close preview">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="preview-stage"><iframe id="preview-frame" title="Website preview"></iframe></div>
  </dialog>
</body>
</html>
