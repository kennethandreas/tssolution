<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sign in · TS Solution admin</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Roboto:wght@500;700&display=swap" />
  <link rel="stylesheet" href="/admin/static/admin.css" />
  <script src="/admin/static/login.js" defer></script>
</head>
<body class="login-page">
  <main class="login-card">
    <img class="login-logo" src="/assets/img/logo-ts-solution.png" width="180" height="45" alt="TS Solution Facility Service" />
    <h1>Admin sign in</h1>
    <p class="login-sub">Manage the content of tssolution.co.id</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="link-btn" id="toggle-password" aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>
      <p class="form-error" id="login-error" role="alert" hidden></p>
      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Sign in</button>
    </form>

    <a class="login-back" href="/">← Back to website</a>
  </main>
</body>
</html>
